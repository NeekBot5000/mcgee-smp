name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  MC_VERSION: "26.2"   # must match the server; Geyser supports Java 26.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Available paper-api versions for this Minecraft version
        run: |
          curl -sSL --max-time 30 \
            https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml \
            | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | grep "^${MC_VERSION}\." | tail -5 || true

      # Paper 26.x API class files are Java 25 (version 69).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -ntp package

      - uses: actions/upload-artifact@v4
        with:
          name: McGeeSMP-jar
          path: target/*.jar
          if-no-files-found: error

      # A real server, the same version Nic runs, with the plugin installed.
      # This FAILS the build if anything is wrong - it used to skip quietly
      # because Paper retired the v2 download API (it now returns 410).
      - name: Boot test on a real Paper server
        run: |
          mkdir -p run/plugins && cp target/*.jar run/plugins/
          cd run
          echo "eula=true" > eula.txt

          echo "--- Paper ${MC_VERSION} (latest stable build, fill v3 API) ---"
          INFO=$(curl -sSL --max-time 30 "https://fill.papermc.io/v3/projects/paper/versions/${MC_VERSION}/builds/latest")
          URL=$(echo "$INFO" | python3 -c "import sys,json;print(json.load(sys.stdin)['downloads']['server:default']['url'])")
          echo "$URL"
          curl -sSL --max-time 120 -o paper.jar "$URL"
          test -s paper.jar || { echo "::error::Could not download Paper"; exit 1; }

          echo "--- VaultUnlocked (so the economy hook is exercised) ---"
          VU=$(curl -sSL --max-time 30 "https://api.modrinth.com/v2/project/vaultunlocked/version?game_versions=%5B%22${MC_VERSION}%22%5D" \
               | python3 -c "import sys,json;v=json.load(sys.stdin);print(next(f['url'] for x in v for f in x['files'] if f.get('primary')))")
          echo "$VU"
          curl -sSL --max-time 60 -o plugins/VaultUnlocked.jar "$VU"
          test -s plugins/VaultUnlocked.jar || { echo "::error::Could not download VaultUnlocked"; exit 1; }

          # Run the server with a console we can type into.
          mkfifo console
          java -Xmx2G -jar paper.jar nogui < console > server.log 2>&1 &
          PID=$!
          exec 3>console
          for i in $(seq 1 300); do
            grep -q 'Done (' server.log && break
            kill -0 $PID 2>/dev/null || break
            sleep 1
          done
          if ! grep -q 'Done (' server.log; then
            echo "::error::Server never finished starting"; tail -80 server.log; exit 1
          fi
          echo "smpinfo" >&3
          echo "baltop" >&3
          echo "interest" >&3
          echo "ah restock" >&3
          sleep 5
          echo "stop" >&3
          for i in $(seq 1 90); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null || true
          exec 3>&-

          echo "=== our lines ==="
          grep -iE "mcgee|richest|economy" server.log || true
          echo "=== problems ==="
          grep -iE "could not load|error occurred while enabling|exception" server.log | head -20 || true

          fail=0
          grep -q "McGeeSMP .* enabled" server.log             || { echo "::error::Plugin did not enable"; fail=1; }
          grep -q "Economy registered with Vault" server.log    || { echo "::error::Economy did not hook into Vault"; fail=1; }
          grep -q "is loaded" server.log                        || { echo "::error::/smpinfo did not respond"; fail=1; }
          grep -q "Richest players" server.log                  || { echo "::error::/baltop did not respond"; fail=1; }
          grep -q "Compound interest: 0.5%" server.log          || { echo "::error::/interest did not respond"; fail=1; }
          grep -q "Auction restock: added" server.log           || { echo "::error::Auction restock did not add a listing"; fail=1; }
          test -s plugins/McGeeSMP/auction.yml                  || { echo "::error::auction.yml was not saved"; fail=1; }
          if grep -iE "error occurred while enabling McGeeSMP|could not load 'plugins/McGeeSMP" server.log; then fail=1; fi
          if [ $fail -ne 0 ]; then tail -80 server.log; exit 1; fi
          echo "Boot test passed: plugin enabled, economy hooked, commands answer."

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: McGeeSMP build ${{ github.run_number }}
          files: target/*.jar
          generate_release_notes: false

name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Kept because Paper's versioning has changed before and will again.
      # Runs first so the list is visible even when the compile fails.
      - name: Available paper-api versions
        run: |
          curl -sSL --max-time 30 \
            https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml \
            -o meta.xml || echo "could not fetch metadata"
          if [ -f meta.xml ]; then
            echo "=== latest 10 ==="
            grep -o '<version>[^<]*</version>' meta.xml | sed 's/<[^>]*>//g' | tail -10
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build
        run: mvn -B -ntp package

      - uses: actions/upload-artifact@v4
        with:
          name: McGeeSMP-jar
          path: target/*.jar
          if-no-files-found: error

      # Compiling only proves it builds. This boots a real Paper server with
      # the plugin installed and checks it actually loads - the failure mode
      # compiling can't catch (bad plugin.yml, wrong api-version, a missing
      # class at runtime).
      - name: Boot test on a real server
        run: |
          set -o pipefail
          mkdir -p run/plugins && cp target/*.jar run/plugins/
          cd run
          echo "eula=true" > eula.txt

          VER=$(curl -sSL https://api.papermc.io/v2/projects/paper \
                | python3 -c "import sys,json;print(json.load(sys.stdin)['versions'][-1])" 2>/dev/null || echo "")
          echo "Paper version: ${VER:-unknown}"
          if [ -n "$VER" ]; then
            META=$(curl -sSL "https://api.papermc.io/v2/projects/paper/versions/$VER/builds" || echo "")
            BUILD=$(echo "$META" | python3 -c "import sys,json;b=json.load(sys.stdin)['builds'];print(b[-1]['build'])" 2>/dev/null || echo "")
            JARN=$(echo "$META" | python3 -c "import sys,json;b=json.load(sys.stdin)['builds'];print(b[-1]['downloads']['application']['name'])" 2>/dev/null || echo "")
            if [ -n "$BUILD" ] && [ -n "$JARN" ]; then
              curl -sSL -o paper.jar \
                "https://api.papermc.io/v2/projects/paper/versions/$VER/builds/$BUILD/downloads/$JARN" || true
            fi
          fi

          if [ ! -s paper.jar ]; then
            echo "::warning::Could not download a Paper server; skipping the boot test."
            exit 0
          fi

          # Stop as soon as it has finished starting.
          (sleep 150; echo "stop") | timeout 240 java -Xmx2G -jar paper.jar nogui > server.log 2>&1 || true

          echo "=== plugin lines ==="
          grep -i "mcgee" server.log || true
          echo "=== errors ==="
          grep -iE "could not load|error occurred|exception" server.log | head -20 || true

          if grep -q "McGeeSMP .* enabled" server.log; then
            echo "Plugin loaded and enabled."
          else
            echo "::error::Plugin did not enable. Last 60 lines:"
            tail -60 server.log
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: McGeeSMP build ${{ github.run_number }}
          files: target/*.jar
          generate_release_notes: false

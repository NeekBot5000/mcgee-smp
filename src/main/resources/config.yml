# McGeeSMP configuration

economy:
  # What a brand-new player starts with.
  starting-balance: 100

  # Specific players who start with a different amount (from the task doc).
  # Applied once, the first time they join after this plugin is installed.
  # Bedrock players show up with a leading "." and underscores instead of
  # spaces (".Lighting_12959"); both spellings match.
  starting-balances:
    "Lighting 12959": 55000
    "Viperishfive48": 17000
    "Tonyt1234563": 10000

shards:
  # Everyone online earns this many shards every interval.
  amount: 1
  interval-minutes: 5
  # Money cost per shard with /buyshards (from the task doc: $10,000).
  price: 10000
  # Most shards that can be bought in one go.
  max-buy: 1000

tools:
  # Shard costs. Eternal gear never breaks and is about half the price of the
  # ability tools (task doc). Change any number here and restart.
  eternal_sword: {cost: 50}
  eternal_pickaxe: {cost: 50}
  eternal_axe: {cost: 50}
  eternal_shovel: {cost: 50}
  eternal_hoe: {cost: 50}
  eternal_helmet: {cost: 50}
  eternal_chestplate: {cost: 50}
  eternal_leggings: {cost: 50}
  eternal_boots: {cost: 50}
  tree_axe: {cost: 75}
  excavator: {cost: 100}
  harvester: {cost: 150}

rtp:
  # Random teleports land between these distances from the world centre
  # (divided by 8 in the nether). Capped by the world border.
  min-radius: 500
  max-radius: 5000
  # Enforced for everyone except operators.
  cooldown-seconds: 60
  # Spots tried before giving up (oceans, lava and treetops are rejected).
  attempts: 10

debug: false

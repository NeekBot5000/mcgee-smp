# McGeeSMP configuration

economy:
  # What a brand-new player starts with.
  starting-balance: 100

  # Specific players who start with a different amount (from the task doc).
  # Applied once, the first time they join after this plugin is installed.
  # Bedrock players show up with a leading "." and underscores instead of
  # spaces (".Lighting_12959"); both spellings match.
  starting-balances:
    "Lighting 12959": 55000
    "Viperishfive48": 17000
    "Tonyt1234563": 10000

shards:
  # Everyone online earns this many shards every interval.
  amount: 1
  interval-minutes: 5
  # Money cost per shard with /buyshards (from the task doc: $10,000).
  price: 10000
  # Most shards that can be bought in one go.
  max-buy: 1000
  # DonutSMP gives 10 shards per player kill. Each killer/victim pair is only
  # rewarded once per cooldown, so friends can't farm each other.
  per-kill: 10
  per-kill-cooldown-minutes: 10

tools:
  # Shard costs. Eternal gear never breaks and is about half the price of the
  # ability tools (task doc). Change any number here and restart.
  eternal_sword: {cost: 50}
  eternal_pickaxe: {cost: 50}
  eternal_axe: {cost: 50}
  eternal_shovel: {cost: 50}
  eternal_hoe: {cost: 50}
  eternal_helmet: {cost: 50}
  eternal_chestplate: {cost: 50}
  eternal_leggings: {cost: 50}
  eternal_boots: {cost: 50}
  tree_axe: {cost: 75}
  excavator: {cost: 100}
  harvester: {cost: 150}

rtp:
  # Random teleports land between these distances from the world centre
  # (divided by 8 in the nether). Capped by the world border.
  min-radius: 500
  max-radius: 5000
  # Enforced for everyone except operators.
  cooldown-seconds: 60
  # Spots tried before giving up (oceans, lava and treetops are rejected).
  attempts: 10

auction:
  # Most listings one player can have at once.
  max-listings: 20
  max-price: 100000000000
  restock:
    # One stack of something useful is listed by "Server" every interval.
    enabled: true
    interval-minutes: 5
    # Oldest server listings are removed beyond this many.
    max-server-listings: 30
    # IMPORTANT: each price must stay ABOVE what your shop pays to buy that
    # many back, or players can buy here and sell to the shop for free money.
    # These defaults are deliberately high; check them against your shop.
    # Prices are for the whole stack and vary +/-10% each time.
    items:
      DIAMOND: {amount: 16, price: 16000}
      IRON_INGOT: {amount: 64, price: 9000}
      GOLD_INGOT: {amount: 64, price: 12000}
      EMERALD: {amount: 32, price: 9000}
      NETHERITE_SCRAP: {amount: 4, price: 30000}
      OBSIDIAN: {amount: 64, price: 9000}
      ENDER_PEARL: {amount: 16, price: 6000}
      BLAZE_ROD: {amount: 32, price: 8000}
      GOLDEN_CARROT: {amount: 64, price: 6000}
      COOKED_BEEF: {amount: 64, price: 3000}
      EXPERIENCE_BOTTLE: {amount: 64, price: 15000}
      REDSTONE: {amount: 64, price: 4000}
      LAPIS_LAZULI: {amount: 64, price: 5000}
      QUARTZ: {amount: 64, price: 5000}
      SLIME_BALL: {amount: 32, price: 6000}
      GUNPOWDER: {amount: 64, price: 6000}
      SHULKER_SHELL: {amount: 2, price: 20000}
      GOLDEN_APPLE: {amount: 8, price: 10000}
      TOTEM_OF_UNDYING: {amount: 1, price: 25000}

orders:
  max-per-player: 10
  max-amount: 100000

bounty:
  minimum: 1000

daily:
  money: 1000
  shards: 2
  # Hours between claims (20, so a slightly early login still counts).
  hours: 20

enderchest:
  # 3 = normal size, up to 6 = double. The first 3 rows are the normal
  # ender chest; the extra rows are saved in plugins/McGeeSMP/enderchests/.
  rows: 6

# Task doc: maps don't work, and the locator bar stays off.
maps-disabled: true
locator-bar: false

debug: false

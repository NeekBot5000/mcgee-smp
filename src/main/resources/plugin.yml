name: McGeeSMP
version: '${project.version}'
main: com.mcgee.smp.McGeeSMP
api-version: '1.21'
description: Economy and gameplay systems for the McGee SMP.
authors: [NeekBot5000]
# Vault/VaultUnlocked must be up before we register the economy, and the shop,
# auction house and spawner plugins look the economy up when THEY start, so
# we have to start before them.
softdepend: [Vault, VaultUnlocked]
loadbefore: [EconomyShopGUI, zAuctionHouse, SmartSpawner]
commands:
  smpinfo:
    description: Show plugin status.
  balance:
    description: Show your balance, or someone else's.
    aliases: [bal, money]
    usage: /bal [player]
  pay:
    description: Send money to another player.
    usage: /pay <player> <amount>
  baltop:
    description: The richest players.
    aliases: [balancetop]
  shards:
    description: Show your shards, or someone else's.
    usage: /shards [player]
  buyshards:
    description: Buy shards with money.
    usage: /buyshards <amount>
  shardshop:
    description: Spend shards on eternal gear and ability tools.
    aliases: [tools]
    usage: /shardshop
  rtp:
    description: Teleport somewhere random (overworld or nether).
    aliases: [wild, randomtp]
    usage: /rtp [overworld|nether]
  nightvision:
    description: Toggle permanent night vision.
    aliases: [nv]
  sidebar:
    description: Show or hide your stats sidebar.
    aliases: [sb]
  ah:
    description: The auction house.
    aliases: [auction, auctionhouse]
    usage: /ah [sell <price> | search <text> | mine]
  shardsadmin:
    description: Operator shard controls.
    usage: /shardsadmin <give|take|set> <player> <amount>
    permission: mcgee.admin
  eco:
    description: Operator money controls.
    usage: /eco <give|take|set> <player> <amount>
    permission: mcgee.admin
permissions:
  mcgee.admin:
    description: Operator economy commands.
    default: op
  mcgee.rtp.bypass:
    description: Skip the /rtp cooldown.
    default: op
